name: Publish Windows release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Check and build
        run: |
          node node_modules/typescript/bin/tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --import tsx --test tests/online-update.test.ts tests/windows-service.test.ts tests/windows-deploy.test.ts tests/windows-upgrade.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          $notes = "docs/releases/$version.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Release notes are required' }
          gh release create "v$version" "release/fabula-table-$version.zip" "release/fabula-table-program-$version.zip" "release/fabula-table-rules-$version.zip" "release/fabula-table-upgrade-$version.zip" --verify-tag --title "最终物语 $version" --notes-file $notes --draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "v$version" --draft=false --latest
